name: Validate game data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalogue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate XML and rulebook contracts
        run: python -B -X utf8 -m unittest discover -s tests -v
